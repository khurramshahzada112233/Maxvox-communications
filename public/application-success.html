<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted | MaxVox Communications</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;700&family=Montserrat:wght@300;400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 26px;
            font-family: 'Montserrat', sans-serif;
            color: #1A202C;
            background:
                linear-gradient(135deg, rgba(26, 32, 44, .9), rgba(13, 16, 22, .94), rgba(0, 128, 128, .62)),
                url("https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1800&q=82") center/cover;
        }

        .success-card {
            width: min(620px, 100%);
            padding: clamp(32px, 6vw, 52px);
            border: 1px solid rgba(0, 128, 128, .36);
            border-top: 5px solid #008080;
            text-align: center;
            background: rgba(255, 255, 255, .88);
            box-shadow: 0 30px 100px rgba(26, 32, 44, .28);
            backdrop-filter: blur(20px);
            animation: rise .65s ease both;
        }

        .logo-main-text {
            font-family: 'Oswald', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #008080;
            text-transform: uppercase;
            line-height: 1;
        }

        .logo-sub-text {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1A202C;
            text-transform: uppercase;
        }

        .check {
            position: relative;
            display: grid;
            place-items: center;
            width: 96px;
            height: 96px;
            margin: 30px auto 26px;
            color: #fff;
            background: #008080;
            box-shadow: 0 18px 44px rgba(0, 128, 128, .28);
        }

        .check::after {
            content: "";
            position: absolute;
            inset: -10px;
            border: 2px solid rgba(0, 128, 128, .28);
            animation: pulse 1.7s ease-out infinite;
        }

        .check i {
            font-size: 42px;
            animation: pop .45s .18s ease both;
        }

        .w4-sub-header {
            display: block;
            margin-bottom: 12px;
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-style: italic;
            color: #008080;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(38px, 7vw, 58px);
            line-height: 1.05;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            max-width: 460px;
            margin: 18px auto 30px;
            color: #667085;
            font-size: 16px;
            line-height: 1.8;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 52px;
            padding: 0 24px;
            color: #fff;
            background: #008080;
            border: 1px solid #008080;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.8px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all .24s ease;
        }

        a:hover {
            color: #008080;
            background: transparent;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(.72); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            from { opacity: 1; transform: scale(.86); }
            to { opacity: 0; transform: scale(1.24); }
        }
    </style>
</head>
<body>
    <main class="success-card">
        <div>
            <span class="logo-main-text">MaxVox</span>
            <span class="logo-sub-text">Communications</span>
        </div>
        <div class="check"><i class="fa-solid fa-check"></i></div>
        <span class="w4-sub-header">Application Received</span>
        <h1>Submitted Successfully</h1>
        <p>Thank you for applying to MaxVox Communications. Your application has been sent to HR for review.</p>
        <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </main>
</body>
</html>
